[project]
name = "market-maven"
version = "0.1.0"
description = "MarketMaven backend — stock market forecasting API and ML pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.9.0",
    "pyyaml>=6.0",
    "supabase>=2.0.0",
    "redis>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "pyarrow>=17.0.0",
    "torch>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "prophet>=1.1.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "einops>=0.8.2",
    "mlflow>=3.10.1",
    "networkx==3.3",
    "openai>=2.26.0",
    "tenacity>=9.1.4",
    "responses>=0.26.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".docs",
]
preview = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "SIM",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
]
