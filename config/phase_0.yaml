_base_: config/base.yaml

project:
  name: market-maven
  phase: 0

paths:
  data_dir: artifacts/data/phase0
  checkpoints_dir: artifacts/checkpoints/phase0
  reports_dir: artifacts/reports/phase0

data:
  source: yfinance
  assets: [AAPL, MSFT, GOOGL, AMZN, SPY]
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  interval: "1d"
  seq_len: 60
  horizon_days: 1
  feature_cols: [close, volume, sma_15, sma_45, rsi_14, macd, macd_signal, obv]
  target_col: log_return_1d
  target_horizons: [1]
  direction_threshold: 0.0
  split:
    train_end: "2021-12-31"
    val_end: "2023-12-31"
    test_end: "2025-12-31"
  normalization:
    mode: per_asset_zscore
    clip: 5.0

model:
  type: lstm_baseline
  input_dim: 8
  hidden_dim: 128
  num_layers: 2
  dropout: 0.2
  horizon: 1

training:
  device: mps
  epochs: 50
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  early_stopping_patience: 10
  loss:
    type: mse_plus_sharpe
    lambda_sharpe: 0.0
    temperature: 0.02
    warmup_epochs: 0
  scheduler:
    type: reduce_lr_on_plateau
    factor: 0.5
    patience: 4
    min_lr: 0.000001
  seeds: [42, 123, 456, 789, 1024]

evaluation:
  annualization_factor: 252
  signal_threshold: 0.0
  transaction_cost_bps: 5.0
  fixed_cost_per_trade: 0.0
  slippage_bps: 2.0
  regime:
    window_days: 60
    bull_threshold: 0.05
    bear_threshold: -0.05

api:
  default_model: lstm_baseline
  allow_legacy_prophet: true
