_base_: config/base.yaml

project:
  name: market-maven
  phase: 3

paths:
  data_dir: artifacts/data/phase0   # reuse Phase 0 raw OHLCV data
  sentiment_dir: artifacts/data/phase3
  alpha_dir: artifacts/data/phase3
  checkpoints_dir: artifacts/checkpoints/phase3
  reports_dir: artifacts/reports/phase3

data:
  source: yfinance
  assets: [AAPL, MSFT, GOOGL, AMZN, SPY]
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  interval: "1d"
  seq_len: 90
  horizon_days: 1
  feature_cols:
    - close
    - volume
    - sma_15
    - sma_45
    - rsi_14
    - macd
    - macd_signal
    - obv
    - volume_ratio_20
    - turnover_proxy
    - volatility_20
    - spy_return_1d
    - qqq_return_1d
    - vix_close
    - sentiment_mean
    - sentiment_std
    - sentiment_pos_ratio
    - sentiment_count
    - alpha_1
    - alpha_2
    - alpha_3
    - alpha_4
    - alpha_5
    - alpha_6
    - alpha_7
    - alpha_8
    - alpha_missing_flag
  target_col: log_return_1d
  target_horizons: [1]
  direction_threshold: 0.0
  split:
    train_end: "2021-12-31"
    val_end: "2023-12-31"
    test_end: "2025-12-31"
  normalization:
    mode: per_asset_zscore
    clip: 5.0

multimodal:
  enabled: true
  include_context: true
  include_sentiment: true
  include_alpha: true
  allow_partial_modalities: true
  enable_volume_features: true
  context_symbols: [SPY, QQQ, "^VIX"]
  context_features: [spy_return_1d, qqq_return_1d, vix_close]
  sentiment:
    provider: finnhub
    min_articles_per_day: 1
    neutral_defaults:
      sentiment_mean: 0.0
      sentiment_std: 0.0
      sentiment_pos_ratio: 0.5
      sentiment_count: 0
  alpha:
    enabled: true
    llm_model: gpt-4.1-mini
    temperature: 0.1
    num_factors: 8
    cache_path: artifacts/data/phase3/alpha_cache.jsonl
    fill_value: 0.0
  feature_groups:
    price_tech:
      - close
      - volume
      - sma_15
      - sma_45
      - rsi_14
      - macd
      - macd_signal
      - obv
      - volume_ratio_20
      - turnover_proxy
      - volatility_20
    context:
      - spy_return_1d
      - qqq_return_1d
      - vix_close
    sentiment:
      - sentiment_mean
      - sentiment_std
      - sentiment_pos_ratio
      - sentiment_count
    alpha:
      - alpha_1
      - alpha_2
      - alpha_3
      - alpha_4
      - alpha_5
      - alpha_6
      - alpha_7
      - alpha_8
      - alpha_missing_flag

model:
  type: cnn_transformer_multimodal
  n_features: 27
  seq_len: 90
  horizon: 1
  conv_channels: 128
  conv_kernel: 3
  d_model: 128
  n_heads: 4
  n_encoder_layers: 3
  ff_dim: 256
  dropout: 0.1
  mlp_hidden: 64
  multimodal: true
  encoder_dim: 64
  fusion_dim: 128
  feature_group_sizes:
    price_tech: 11
    context: 3
    sentiment: 4
    alpha: 9

training:
  device: cpu
  epochs: 60
  batch_size: 64
  lr: 0.0006
  weight_decay: 0.0001
  grad_clip_norm: 0.8
  early_stopping_patience: 12
  loss:
    type: mse_plus_sharpe
    lambda_sharpe: 0.12
    lambda_gate_l1: 0.001
    temperature: 0.02
    warmup_epochs: 3
    sharpe_window: 20
  scheduler:
    type: cosine_warm_restarts
    t0: 10
    t_mult: 2
    eta_min: 0.000001
  seeds: [42, 123, 456, 789, 1024]

evaluation:
  annualization_factor: 252
  signal_threshold: 0.0
  transaction_cost_bps: 5.0
  fixed_cost_per_trade: 0.0
  slippage_bps: 2.0
  regime:
    window_days: 60
    bull_threshold: 0.05
    bear_threshold: -0.05

acceptance:
  mae_ratio: 0.98        # multimodal_MAE <= 0.98 * best_prior_MAE
  sharpe_delta: 0.08     # multimodal_Sharpe >= best_prior_Sharpe + 0.08

logging:
  experiment_tracker: mlflow
  run_name_template: "phase3_multimodal_seed_{seed}"
  mlflow_tracking_uri: "artifacts/mlruns"

api:
  default_model: cnn_transformer_multimodal
  allow_legacy_prophet: true
  multimodal_route_enabled: true
  alpha_version: "phase3-v1"
