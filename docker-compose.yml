version: "3.8"

services:
  miniconda:
    build: .
    volumes:
      - .:/app
      - ./config:/app/config
      - ./artifacts:/app/artifacts
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    networks:
      - market-maven
    dns:
      - 8.8.8.8
      - 8.8.4.4

networks:
  market-maven:
